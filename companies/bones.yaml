# =============================================================================
# companies/bones.yaml — 会社ファイルのサンプル(BONES)
# =============================================================================
# 値の確度:
#   - 設立年・所在地(区まで)・関連会社は Web で確認済み
#   - `null` の項目は未確認(公式サイトで確認して埋める)
#   - roles は「サンプル」です。実際の募集職種に合わせて直してください
# =============================================================================

schema_version: 1

# 会社ID: 不変の主キー。会社名が変わってもこの ID で参照する。
id: 24c7cee1-2d78-4ad4-b145-f5ba4ff7fca4
# slug: ファイル名・URL用の読みやすい別名。IDとは別物で、変えても参照は壊れない。
slug: bones

name: 株式会社ボンズ              # 現在の正式名称
display_name: BONES               # 通知・一覧での表示名
name_en: BONES Inc.
# 社名変更の履歴(変更があったときだけ追記する)
name_history: []

founded_year: 1998                # 1998年10月、サンライズ出身のスタッフが設立

location:
  prefecture: 東京都
  city: 杉並区
  area: 井草
  address: null                   # 番地までは資料により表記が割れていたため、公式サイトで要確認

# 募集する職種(common.yaml の job_roles のIDから選ぶ)※サンプル値
# 職種の除外語(job_roles.*.exclude_words)をこの会社だけ調整するときは、IDの代わりに
# 次の形で、その職種のすぐ隣に書く(add / remove は片方だけでもよい)。
#   - id: storyboard
#     exclude_words: {remove: [コンテスト]}      # この会社の採用投稿では「コンテスト」が普通に出る
#   - id: key_animator
#     exclude_words: {add: [原画展示]}
roles:
  - production_assistant
  - key_animator
  - in_between
  - finishing
  - compositing
  - cg_3d

# グループ会社・関連会社(会社ファイルが別にある場合は company_id で参照する)
related_companies:
  - name: 株式会社ボンズフィルム
    company_id: null              # 会社ファイルを作ったらそのUUIDを入れる
    relation: 2024-10-01 にボンズのアニメ制作部門を分社化して発足

website: https://www.bones.co.jp/

# SNS
sns:
  # 公式アカウント。プラットフォームごとにリスト(複数アカウントを書ける)。
  #   handle: @ なしで書く(@ 付きで書いても生成時に取り除く)。未確認は null。
  #   label:  どのアカウントか分かる名前(任意)。通知に表示できる。
  #   monitor: true のアカウントは、common.yaml の既定フィルター(採用ワード)付きで監視される。
  # 公式サイトのトップにはSNSへのリンクが見つからなかったため、すべて未設定。
  accounts:
    x:
      - handle: null
        monitor: true
    youtube:
      - handle: null
        monitor: false
    instagram:
      - handle: null
        monitor: false
    bluesky:
      - handle: null
        monitor: false

  # 検索フィルター設定。何も書かなくても、アカウントがあれば既定フィルターが自動で効く。
  search:
    # 既定フィルター(common.yaml の sns.default_filter)に対する、この会社だけの調整。
    # 含める語(include)と弾く語(exclude)を隣り合わせに書く。必要なときだけ書く。
    default_filter:
      include:                    # 含める語(採用ワード)
        add: []                   # 例: [研修生, 動画研修生]
        remove: []                # 例: [求人]
      exclude:                    # 弾く語
        add: []
        remove: []
    # 会社名で広く検索したいときだけ有効にする(アカウントに限定しない検索)。
    # 共通の search_presets の名前を書く。空なら生成しない。
    keywords: [BONES, ボンズ, 株式会社ボンズ]   # use_presets を使うときの検索語
    use_presets: []                # 例: [company_recruit, role_recruit]
    # 共通のプリセットが使えない場合だけ、この会社専用のクエリを書く。
    # 例: 社名が「ボンズ」だけだと他の語とぶつかる会社は、除外語を足したクエリにする。
    custom: {}
    #   x_custom_example:
    #     platform: x
    #     query: '(ボンズ OR BONES) アニメ (採用 OR 募集) -BONDS'

# 監視するURL
# urlwatch: の中身は urlwatch の urls.yaml の1ジョブにそのまま対応する
#           (name と url はここの値から自動で組み立てるので書かない)。
# 共通のWeb除外(common.yaml の web.excludes のうち auto: true のもの)は自動で適用される。
#   - 除外フィルターは urlwatch.filter の先頭に挿入される
#   - web.job_defaults(max_tries など)は、ここの urlwatch: に同じキーを書けばそちらが優先される
# snippets: auto: false の除外を追加で使うとき(例: strip_all_html_comments)
# skip_common_excludes: 自動適用を外したい除外の名前のリスト(all なら全部)
# urlwatch に渡す name は "{monitors[].name} - {display_name}" で生成
#           (例: 採用情報 - BONES。いまの urls.yaml と同じ名前になる)。
monitors:
  - id: recruit            # 会社内で一意。通知やキャッシュのキーに使う
    name: 採用情報
    url: https://www.bones.co.jp/recruit/
    category: recruit      # recruit / news / works / other など
    enabled: true
    roles: []              # 空=この会社の全職種。特定の職種のページなら職種IDを入れる
    snippets: []
    skip_common_excludes: []
    urlwatch:              # 現行の urls.yaml にある <script>/<style> 除去(nonce対策)は、
                           # 全サイト共通の web.excludes.strip_script_style に移したので、ここには書かない
      filter:
        - beautify
        - strip
