# =============================================================================
# common.yaml — 全社共通設定(サンプル / 方針決め用ドラフト)
# =============================================================================
# 会社ファイル (db/companies/*.yaml) から参照される「共通の辞書」です。
#   1. job_roles  職種ID → 職種名・検索語・除外語(会社ファイルは ID だけを書く)
#   2. sns        SNSプラットフォーム定義(RSSHubのルート)・既定フィルター(含める語/弾く語)・検索プリセット
#   3. web        Webサイト監視(urlwatch)の既定値と、誤検知対策の除外フィルター
#
# 除外の設定は、効かせる対象のすぐ隣に書く:
#   職種の除外語 → job_roles.*.exclude_words(keywords の隣)
#   SNSの除外語  → sns.default_filter.exclude(include の隣)
#   Webの除外    → web.excludes.*(条件 auto・説明・フィルター本体を1か所に)
#
# ルール:
#   - 職種ID は一度決めたら変更しない(表示名 name は自由に変えてよい)
#   - 職種ID は小文字の snake_case
# =============================================================================

schema_version: 1

# -----------------------------------------------------------------------------
# 0. 種別(会社ファイルの type)
# -----------------------------------------------------------------------------
# アニメ会社以外の、就活・求人に関するサイトやSNS(求人ポータル、就活イベント、業界団体など)も、
# 会社ファイルと同じ形式で書ける。type で区別し、type ごとの通知先チャンネルを
# config/discord.yaml の channels.types で決められる(職種が決まらない通知は、そこへ送る)。
company_types:
  studio:
    name: アニメ会社
  portal:
    name: 就活・求人サイト(アニメ会社ではないもの)

# -----------------------------------------------------------------------------
# 1. 職種
# -----------------------------------------------------------------------------
# keywords      SNS検索で職種を拾う語(表記ゆれを含める)。
# exclude_words この職種の語を使っていても、採用ではない投稿を弾く語(誤検知対策)。
#   - 職種ごとに閉じて効く。検索クエリは職種ごとのかたまりになる:
#       ((原画 OR 原画マン) -"原画展" -"原画集") OR ((動画 OR …) -"動画配信" …)
#     → ある職種の除外語が、別の職種の投稿を巻き込んで消すことはない。
#   - 緩め運用: 迷ったら入れない。入れるのは「採用の投稿や会社の告知文には、まず出てこない語」
#     だけ(原画展・撮影会・Webライティング など)。募集文や告知に出うる語
#     (コンテンツ・動画配信・建築・依頼受付・時代背景 など)は、誤検知を減らせても
#     正しい投稿まで消えるので入れない。
#   - 空 [] は「紛れにくい、または紛れ防止より取りこぼしの方が困る」の意味。
#     運用して紛れが見つかったら足していく。
#   - 除外語は、同じ職種の keywords と同じ語・その一部にしない(自分の投稿を消すため)。
job_roles:
  producer:
    name: プロデューサー
    keywords: [プロデューサー, 制作プロデューサー]
    exclude_words: [プロデューサーさん]
  production_desk:
    name: 制作デスク
    keywords: [制作デスク]
    exclude_words: []   # 他の意味で使われにくいので空
  production_assistant:
    name: 制作進行
    keywords: [制作進行, 進行]
    exclude_words: [司会進行, 進行役]
  setting_production:
    name: 設定制作
    keywords: [設定制作]
    exclude_words: []   # 他の意味で使われにくいので空
  director:
    name: 演出
    keywords: [演出, 監督]
    exclude_words: [舞台演出, 野球監督, 工事監督]
  storyboard:
    name: 絵コンテ
    keywords: [絵コンテ, コンテ]
    exclude_words: [コンテスト, コンテナ]
  script:
    name: 脚本
    keywords: [脚本, シナリオ]
    exclude_words: [TRPG, マーダーミステリー, マダミス, 舞台脚本]
  animation_director:
    name: 作画監督
    keywords: [作画監督, 作監]
    exclude_words: []   # 他の意味で使われにくいので空
  key_animator:
    name: 原画
    keywords: [原画, 原画マン]
    exclude_words: [原画展, 原画集, 複製原画, 原画販売, 原画プレゼント]
  in_between:
    name: 動画
    keywords: [動画, 動画マン, 動画研修生]
    exclude_words: [動画投稿, 動画編集, YouTube動画]
  in_between_check:
    name: 動画検査
    keywords: [動画検査]
    exclude_words: []   # 他の意味で使われにくいので空
  fx_animator:
    name: エフェクト作画
    keywords: [エフェクト, 特殊効果, エフェクト作画]
    exclude_words: [サウンドエフェクト, 音響エフェクト, エフェクター, 特殊メイク]
  finishing:
    name: 仕上げ
    keywords: [仕上げ, 色指定, 検査]
    exclude_words: [PCR検査, 抗原検査, 血液検査, 内装仕上げ, 塗装仕上げ]
  color_design:
    name: 色彩設計
    keywords: [色彩設計, 色設計]
    exclude_words: [インテリア, 内装, カラーコーディネーター]
  background_art:
    name: 背景美術
    keywords: [背景, 美術, 背景美術]
    exclude_words: [美術展, 美術作品, 美術館, 背景透過, 壁紙]
  art_direction:
    name: 美術設定・美術監督
    keywords: [美術設定, 美術監督]
    exclude_words: []   # 他の意味で使われにくいので空
  compositing:
    name: 撮影
    keywords: [撮影, 撮影監督, コンポジット]
    exclude_words: [撮影会, 撮影禁止, 撮影モデル, 撮影スポット, オフショット, ロケ撮影, コンポジットレジン, コンポジット材]
  # --- 3DCG(工程別) ---
  # cg_3d は「3DCGアーティスト」など工程を指定しない募集用の総称。
  # 工程が分かる募集は下の個別の職種を使う(複数選んでよい)。
  cg_3d:
    name: 3DCG(工程指定なし)
    keywords: [3DCG, CGアーティスト, CGジェネラリスト, CGデザイナー]
    exclude_words: [建築パース, 3DCGパース, 3Dモデル販売]
  cg_director:
    name: CGディレクター・CGスーパーバイザー
    keywords: [CGディレクター, CGスーパーバイザー, CGSV]
    exclude_words: []   # 他の意味で使われにくいので空
  cg_production:
    name: CG制作進行・CGプロデューサー
    keywords: [CG制作進行, CGプロデューサー, CGプロダクションマネージャー]
    exclude_words: []   # 他の意味で使われにくいので空
  cg_modeler:
    name: キャラクター・メカモデリング
    keywords: [CGモデラー, モデラー, モデリング, キャラクターモデラー, メカモデラー]
    exclude_words: [ガンプラ, プラモ, ジオラマ, データモデリング]
  cg_bg_modeler:
    name: 背景モデリング(3D背景)
    keywords: [背景モデラー, 背景CG, 3D背景, CG背景]
    exclude_words: [VRChat, Vket]
  cg_texture_shader:
    name: テクスチャ・マテリアル・シェーダー
    keywords: [テクスチャ, マテリアル, シェーダー, テクスチャアーティスト]
    exclude_words: [食感, スキンケア, ヘアケア, 化粧品, 建築マテリアル, マテリアルハンドリング, Minecraft, マイクラ]
  cg_rigger:
    name: リギング・キャラクターセットアップ
    keywords: [リガー, リギング, キャラクターセットアップ]
    exclude_words: [玉掛け, クレーン, 船舶, ヨット]
  cg_animator:
    name: 3Dアニメーター
    keywords: [CGアニメーター, 3Dアニメーター, 3Dアニメーション]
    exclude_words: []   # 他の意味で使われにくいので空
  cg_mocap:
    name: モーションキャプチャ
    keywords: [モーションキャプチャ, モーキャプ, モーションデータ]
    exclude_words: [被験者, 歩行分析]
  cg_layout:
    name: 3Dレイアウト・カメラ
    keywords: [3Dレイアウト, CGレイアウト, レイアウトアーティスト]
    exclude_words: [店舗レイアウト, 工場レイアウト]
  cg_effects:
    name: CGエフェクト(VFX)
    keywords: [CGエフェクト, VFX, FXアーティスト, Houdini]
    exclude_words: [FX取引, 為替, マジシャン]
  cg_lighting_compositing:
    name: ライティング・CGコンポジット
    keywords: [CGライティング, ライティング, ライティングアーティスト, CGコンポジット]
    exclude_words: [Webライティング, SEOライティング, コピーライティング, セールスライティング]
  cg_technical:
    name: テクニカルアーティスト
    keywords: [テクニカルアーティスト, TA]
    exclude_words: [ティーチングアシスタント]
  editing:
    name: 編集
    keywords: [編集, アニメ編集]
    exclude_words: [編集部, 編集者, 編集長, 書籍編集, 雑誌編集, 漫画編集]
  pipeline_engineer:
    name: パイプライン/システムエンジニア
    keywords: [パイプライン, システムエンジニア, 制作システム]
    exclude_words: [営業パイプライン, 石油パイプライン]
  corporate:
    name: 管理部門(総務・経理・広報など)
    keywords: [総務, 経理, 広報, 管理部門]
    exclude_words: [総務省, 広報誌, 広報紙]

# -----------------------------------------------------------------------------
# 2. SNS
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# 通信の設定(タイムアウト・再試行)。スクリプトの中には書かず、ここだけで調整する。
#   SNS の取得は sns.fetch、サイト監視の再試行は web.retry を参照。
# -----------------------------------------------------------------------------
network:
  discord:
    timeout_seconds: 30
    max_retries: 4            # 429(レート制限)と 5xx のとき、同じ送信を何回まで試すか(待ち時間は 2倍ずつ増える)
  wayback:
    timeout_seconds: 60
    retries: 2                # 保存に失敗したとき、あと何回やり直すか
    retry_wait_seconds: 10
  probe_timeout_seconds: 20   # 「報告なし」のURLの状態を調べるときのタイムアウト
  urlwatch_run_timeout_seconds: 1800   # urlwatch 1回の実行の上限

sns:
  # フィードの取得方法。
  #   失敗したものは、全フィードの取得が終わってから retry_wait_seconds 秒待って取り直す(retry_rounds 回まで)。
  #   すぐに取り直さないのは、同じ相手へ続けて要求してブロック(bot判定)されにくくするため。
  #   request_interval_seconds: フィードとフィードのあいだに空ける秒数。
  #   error_renotify_hours: 取り直しても失敗したフィードのエラーを、同じものについては何時間おきにしか通知しないか(0なら省略せず毎回通知)。
  fetch:
    # 1フィードの待ち時間(秒)。2026-11 のログで、取得できたものは最長でも約6秒、失敗は30秒待ってもタイムアウトだったため 10 に短縮。
    timeout_seconds: 10
    request_interval_seconds: 0.5
    # 同時に取得するフィード数。1なら1件ずつ。タイムアウトが多いと1件30秒かかるため、並行して取得すると実行時間が大きく縮む。
    # 取得を始める間隔は、並行していても request_interval_seconds 以上あける。RSSHub 側で制限を受けて失敗が増えるなら下げる。
    concurrency: 4
    # RSSHub を複数使うとき(RSSHUB_BASE_URL_2 など)は、1つ目を使い、連続でこの回数失敗したら2つ目に切り替え、また失敗が続けば1つ目に戻る。
    # 次回の実行は、前回最後に使ったものとは別のものから始める。失敗した1件は、その場で別の RSSHub でも取り直す。
    switch_after_failures: 3
    # X(RSSHub)は短時間に要求しすぎると制限され、ほぼ全部がタイムアウトになる(2026-11 のログでは、約135件取得したあと止まり、約10分後に少しだけ回復していた)。
    # そのため、少しずつ取得し、ほぼ全滅したら制限とみなして待つ。待っても続くなら、残りは次回に回す。次回は「取得してから長いもの」を先に取る。
    rate_limit:
      enabled: true
      chunk_size: 16          # この件数ごとに状況を見る
      failure_ratio: 0.9      # chunk のうちタイムアウトがこの割合以上なら制限とみなす
      wait_seconds: 540       # 制限とみなしたときの待ち時間
      waits: 2                # 待つ回数(超えたら残りは次回へ)。2026-11-12 のログで、最初に約112件取得 → 9分待つと約58件 取得できたため、2回待つ
    retry_rounds: 2
    retry_wait_seconds: 120
    # 最初の取得にこの秒数以上かかったときは、再試行をしない(実行時間が延びすぎないように)。
    # また、前回から続けて失敗している(エラー通知済みの)フィードは、再試行をしない。
    retry_time_budget_seconds: 600
    # 公開から何日より前の投稿は通知しない(0で無効)。YouTube のように古い動画が一覧に出るフィードで、過去分が一度に届くのを防ぐ。
    max_age_days: 30
    youtube:
      timeout_seconds: 30   # YouTube 公式フィードの待ち時間(秒)
    error_renotify_hours: 0   # 0 = 毎回すべて通知する(省略しない)

  # RSSHubのルート定義。
  #   handle_prefix: ルートへ渡すときにアカウントIDの前へ付ける文字。
  #     会社ファイルのアカウントIDは @ なしで書く。YouTube のように @ が必要なものだけ
  #     生成時にここで付ける。@ 付きで書かれていても生成時に取り除いてから処理する。
  # ※ルートはRSSHubのバージョンや認証設定で変わるため、実運用前に使うインスタンスで要確認。
  #   {base} は RSSHub インスタンスのURL(設定または GitHub Actions の secrets で渡す)。
  platforms:
    x:
      label: X (旧Twitter)
      handle_prefix: ""
      user_feed: "{base}/twitter/user/{handle}"
      # ユーザーフィードのURLに足すパラメータ。includeRts=0 でリポスト(RT)を含めない。
      # ※RSSHubのバージョンによっては効かないので、下の exclude_retweets でも本文から判定して除く。
      user_params: "includeRts=0"
      search_feed: "{base}/twitter/keyword/{query}"
    youtube:
      label: YouTube
      handle_prefix: "@"
      # direct: RSSHub を通さず取得する方式。
      #   youtube_api … YouTube Data API(公式)。GitHub の Secrets に YOUTUBE_API_KEY が必要。速くて確実(推奨)。
      #   youtube     … 公式フィード(videos.xml)を直接。GitHub Actions からは 404 になることがあるため非推奨。
      #   行を消す    … RSSHub 経由(下の user_feed / channel_feed)。RSSHub 側が遅いと取得できない。
      #   絞り込みは、どの方式でも採用ワード・除外語を同じように使う。@ID は一度だけチャンネルIDに直して控える。
      direct: youtube_api
      direct_feed: "https://www.youtube.com/feeds/videos.xml?channel_id={id}"
      handle_page: "https://www.youtube.com/@{handle}"
      user_feed: "{base}/youtube/user/{handle}"
      # チャンネルID(UC + 22文字)で書かれたアカウントは、こちらのルートを使う(@ID が分からないチャンネル用)。
      channel_feed: "{base}/youtube/channel/{handle}"
      channel_id_pattern: 'UC[0-9A-Za-z_-]{22}'
      search_feed: null
    instagram:
      label: Instagram
      # false にすると、Instagram の監視を全社まとめて止める。(2026-11-07: RSSHub 経由は bot 判定で 503 になり、アカウントも危険なため停止)
      enabled: false
      handle_prefix: ""
      user_feed: "{base}/instagram/user/{handle}"
      search_feed: null
    bluesky:
      label: Bluesky
      handle_prefix: ""
      user_feed: "{base}/bsky/posts/{handle}"
      search_feed: null

  # リポスト(リツイート)を通知しない。true なら、RSSHubのパラメータ(user_params)に加えて、
  # 本文が「RT @」「🔁」で始まる投稿も取り除く(検索系のクエリには -filter:retweets が付く)。
  exclude_retweets: true

  # 既定フィルター: 公式アカウント(monitor: true)のフィードを、採用ワードで絞り込む。
  # 会社ファイルに何も書かなくても、アカウントさえあれば自動で適用される。
  # include(含める語)と exclude(弾く語)は、隣り合った2つで1組。
  # RSSHub 共通の filter / filterout パラメータ(正規表現)を使うので、
  # X・YouTube・Instagram・Bluesky のどれでも同じ考え方で動く。
  # 会社ごとの調整は、会社ファイルの sns.search.default_filter に
  # include / exclude それぞれの add / remove で書く。
  # 生成時に URL エンコードする。生成例:
  #   {base}/twitter/user/EXAMPLE?filter=採用|募集|…&filterout=プレゼント|…
  default_filter:
    rsshub_query: "filter={include}&filterout={exclude}"   # exclude が空なら filterout は付けない
    # 含める語(採用ワード)。X の検索で言う「(募集 OR 応募 OR 採用 …)」の部分。
    # ※「応募」を含むため、プレゼント企画などを下の exclude で弾いている。
    include:
      - 募集
      - 応募
      - 採用
      - 求人
      - 新卒
      - 企業説明会
      - 会社説明会
    # 弾く語。X の検索で言う「-抽選 -発売 -プレゼント -🎁 -キャンペーン」の部分。
    exclude:
      - 抽選
      - 発売
      - プレゼント
      - "🎁"
      - キャンペーン
      - 舞台挨拶
      - お便り

  # 追加の検索プリセット(既定ではない)。
  # 会社ファイルの sns.search.use_presets に名前を書いたときだけ生成される。
  # 会社名で広く拾いたいとき用(X のキーワード検索ルートが使えるインスタンスのみ)。

  # 検索クエリ1本あたりの最大文字数。
  # X の検索クエリは 500 文字前後が上限の目安(X API は 512 文字。RSSHub 経由で同じかは要確認)。
  # {role_clauses} を入れると、この長さを超えるぶんは職種のかたまり単位で複数のクエリに自動分割する。
  search_max_query_length: 480
  # 全プリセットの末尾に自動で付ける除外(リツイートを除く)。プリセット側には書かない。
  search_query_suffix: "-filter:retweets"

  # プリセットのプレースホルダ:
  #   {company_keywords} 会社ファイルの sns.search.keywords を OR で連結
  #   {role_keywords}    会社ファイルの roles に対応する job_roles.keywords を OR で連結(除外語なし)
  #   {role_clauses}     職種ごとのかたまりを OR で連結(職種ごとの exclude_words 付き)。
  #                      かたまり = ((keywords を OR) -"除外語1" -"除外語2" …)
  #                      会社ごとの調整は、会社ファイルの roles で、その職種のすぐ隣に書く。
  search_presets:
    company_recruit:
      description: 会社名 + 採用ワード(アカウントに限定しない)
      x:
        query: '({company_keywords}) (募集 OR 応募 OR 採用 OR 求人 OR 新卒 OR 企業説明会 OR 会社説明会) -抽選 -発売 -プレゼント -🎁 -キャンペーン'
    role_recruit:
      description: 会社名 + その会社が募集する職種名
      x:
        query: '({company_keywords}) ({role_clauses}) (募集 OR 採用 OR 求む)'
    announcement:
      description: 会社名 + 新作・体制変更などのお知らせ
      x:
        query: '({company_keywords}) (お知らせ OR 制作決定 OR 参加決定 OR スタッフ募集)'

# -----------------------------------------------------------------------------
# 3. Webサイト監視(urlwatch)
# -----------------------------------------------------------------------------
web:
  # エラー(接続できないなど)になったジョブを、全部の確認が終わってから wait_seconds 秒待って取り直す(rounds 回まで)。
  # 取り直してもエラーのままのものは、同じジョブについて error_renotify_hours 時間おきにしか通知しない(0なら省略せず毎回通知)。
  #   rounds を増やすほど、bot対策で一時的に弾かれたサイトが取れる可能性が上がる(そのぶん実行時間が延びる)。
  retry:
    rounds: 3
    wait_seconds: 120
  error_renotify_hours: 0   # 0 = 毎回すべて通知する(省略しない)

  # 変更の通知のAI要約の設定は、config/ai.yaml にあります。

  # bot対策の確認ページ("One moment, please..." など)が返ってきたら、変更とは扱わず「エラー」にして取り直す。
  # markers は正規表現(大文字小文字は区別する)。確認ページに出る文言を足せば、対象が増える。
  bot_challenge:
    enabled: true
    markers:
      - 'One moment, please\.\.\.'
      - 'Please wait while your request is being verified'
      - 'Just a moment\.\.\.'
      - 'Checking your browser before accessing'
      - 'Attention Required! \| Cloudflare'
      - 'Enable JavaScript and cookies to continue'

  # urlwatch ジョブの既定値(監視URL側で同じキーを書けばそちらが優先)。
  # 一時的な HTTP エラー(タイムアウト・メンテナンス中の 503 など)だけを通知しない。
  # 404 や 403 は含めていない(ページ消失・アクセス拒否は気づきたいため)。
  #   max_tries: 1 にしてあるのは、エラーを「何回続いたら報告するか」を urlwatch に任せず、
  #   スクリプト側の再試行(web.retry)で取り直し、それでも失敗したものだけを通知するため。
  job_defaults:
    max_tries: 1
    ignore_http_error_codes: "408, 429, 500, 502, 503, 504"

  # 誤検知対策の除外フィルター。1つの除外に「効かせる条件(auto)・説明・フィルター本体」をまとめて書く。
  #   auto: true   全監視URLの filter の先頭に、ここに書いた順で自動挿入する。
  #                HTML のまま処理する段階なので、サイト側の beautify / css / html2text /
  #                re.findall より前に動く。外したい監視URLは skip_common_excludes に名前(または all)を書く。
  #   auto: false  自動では使わない。必要な監視URLだけ、会社ファイルの monitors[].snippets に名前を書く。
  # regex は YAML の単引用符の中に書くため、属性の引用符は " だけを想定している
  # (WordPress の出力に合わせた形)。' で書かれたサイトには効かない場合がある。
  excludes:
    strip_script_style:
      auto: true    # nonce など毎回変わる値が <script> に入っている
      description: <script> と <style> を中身ごと除去する(nonce 等の誤検知対策)
      filter:
        - re.sub:
            pattern: '(?is)<script\b[^>]*>.*?</script>'
            repl: ''
        - re.sub:
            pattern: '(?is)<style\b[^>]*>.*?</style>'
            repl: ''

    strip_cache_comments:
      auto: true    # <!-- Cached by ... 2026-09-26 --> のようなキャッシュ系コメント
      description: キャッシュ系プラグインが入れる時刻入りHTMLコメントを除去する。
        キーワードを含むコメントだけを対象にするので、<!-- p-block-recruit --> のような
        目印コメントは残る(re.findall で目印を使うサイト向け)。
      filter:
        - re.sub:
            pattern: '(?is)<!--(?:(?!-->).)*?(?:cache|generated in|served from|optimized by)(?:(?!-->).)*?-->'
            repl: ''

    strip_asset_versions:
      auto: true    # style.css?ver=1234 のキャッシュバスター
      description: URL 末尾のキャッシュバスター(?ver= など)を除去する。差分用の正規化なので URL の見た目が崩れてもよい。
        YouTube の watch?v= は対象外。
      filter:
        - re.sub:
            pattern: '(?i)[?&](?:amp;)?(?:ver|cb|ts|timestamp|nocache)=[^"&\s<>]*'
            repl: ''

    strip_form_tokens:
      auto: true    # フォームの hidden nonce / CSRF トークン
      description: フォームの hidden nonce / CSRF トークンの値を空にする(name が value より前にある形のみ対応)。
      filter:
        - re.sub:
            pattern: '(?is)(<input\b[^>]*\bname="(?:_wpnonce|_wp_http_referer|_csrf|csrf[-_]?token|authenticity_token|__RequestVerificationToken|nonce)"[^>]*\bvalue=")[^"]*(")'
            repl: '\1\2'
        - re.sub:
            pattern: '(?is)(<meta\b[^>]*\bname="csrf-token"[^>]*\bcontent=")[^"]*(")'
            repl: '\1\2'
        - re.sub:
            pattern: '(?i)(\bdata-(?:nonce|csrf|token)[\w-]*=")[^"]*(")'
            repl: '\1\2'

    normalize_copyright_year:
      auto: true    # © 2026 → 毎年1月1日に全サイトが一斉に変わるのを防ぐ
      description: 著作権表記の年(© 2026 / © 2020-2026)を取り除く。
      filter:
        - re.sub:
            pattern: '(?i)(©|&copy;|&#169;|copyright)\s*(?:19|20)\d{2}(?:\s*[-–~〜]\s*(?:19|20)\d{2})?'
            repl: '\1'

    strip_access_counter:
      auto: true    # アクセスカウンター(Today : 226 / Yesterday / Total)と、毎日変わる日付表示
      description: アクセスカウンター(Today / Yesterday / Total / 本日 / 昨日 / 累計 + 数字)と、
        曜日つきの今日の日付(2026.11.10 Tuesday)を取り除く。表示のたびに値が変わり、毎回「変更あり」になるため。
        &nbsp; が文字のまま入っているページにも対応する。
      filter:
        - re.sub:
            pattern: '(?i)\b(?:today|yesterday|total)(?:&(?:amp;)?nbsp;|&#160;|[\s\u00a0]|<[^>]*>)*[:：](?:&(?:amp;)?nbsp;|&#160;|[\s\u00a0]|<[^>]*>)*[\d,]+|(?:本日|昨日|累計)(?:&(?:amp;)?nbsp;|&#160;|[\s\u00a0]|<[^>]*>)*[:：](?:&(?:amp;)?nbsp;|&#160;|[\s\u00a0]|<[^>]*>)*[\d,]+'
            repl: ''
        - re.sub:
            pattern: '(?i)\b(?:19|20)\d{2}[./-]\d{1,2}[./-]\d{1,2}(?:&(?:amp;)?nbsp;|&#160;|[\s\u00a0]|<[^>]*>)*(?:Mon|Tues|Wednes|Thurs|Fri|Satur|Sun)day\b'
            repl: ''

    strip_access_counter_text:
      auto: true
      stage: text   # html2text のあとの文字を処理する(&nbsp; が文字のまま残る形や、タグで区切られた形に確実に効く)
      description: strip_access_counter の、html2text のあとの文字版。
      filter:
        - re.sub:
            pattern: '(?i)(?:\b(?:today|yesterday|total)|本日|昨日|累計)(?:&nbsp;|&amp;nbsp;|\s)*[:：](?:&nbsp;|&amp;nbsp;|\s)*[\d,]+'
            repl: ''

    strip_stray_comment_end:
      auto: true    # 行頭の単独の --> (コメントの閉じだけが残る形。Wix のサイトなどで出たり消えたりして毎回「変更あり」になる)
      description: 行だけの --> を取り除く。ページの出力が揺れて、コメントの閉じだけが現れたり消えたりするため。
        追加・変更した直後は、全サイトで差が出るので、Actions を baseline を true にして1回実行し、記録だけ進める。
      filter:
        - re.sub:
            pattern: '(?m)^[ \t]*-->[ \t]*(?:\r?\n|$)'
            repl: ''

    strip_stray_comment_end_text:
      auto: true
      stage: text
      description: strip_stray_comment_end の、html2text のあとの文字版。
      filter:
        - re.sub:
            pattern: '(?m)^\s*-->\s*$'
            repl: ''

    strip_all_html_comments:
      auto: false
      description: HTMLコメントをすべて除去する。<!-- 目印 --> を re.findall で使うサイトでは使わないこと。
      filter:
        - re.sub:
            pattern: '(?s)<!--.*?-->'
            repl: ''
