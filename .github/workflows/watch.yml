# 本番の実行: SNS監視(RSSHub)とサイト監視(urlwatch)を行い、Discord(Bot)へ通知する。
# 定期実行(schedule)は付けていない。cron-job.org などから workflow_dispatch(GitHub API)で1時間おきに起動する。
# 手動実行のテストは watch-test.yml。状態(既読・キャッシュ)は、そちらと共有する。
name: watch

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'サイト監視の変更を通知せず、今の内容を基準にする(フィルターを変えた直後に1回だけ true)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL }}
      RSSHUB_ACCESS_KEY: ${{ secrets.RSSHUB_ACCESS_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 設定ファイルのチェック
        run: python scripts/check_companies.py

      - name: 状態を復元
        uses: actions/cache/restore@v4
        with:
          path: |
            .urlwatch/cache-companies.db
            .urlwatch/error-state.json
            .rsshub-state/state.json
            .urlwatch-last-good
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      - name: RSSHub(SNS監視)
        run: python -u scripts/rsshub_notify.py

      # RSSHub の送信に失敗しても、サイト監視は続ける
      - name: urlwatch(サイト監視)
        if: ${{ !cancelled() }}
        run: python scripts/urlwatch_notify.py --skip-new --wayback ${{ inputs.baseline && '--baseline' || '' }}

      # どちらかが失敗しても、進んだ状態は必ず保存する(同じ通知を繰り返さないため)
      - name: 状態を保存
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            .urlwatch/cache-companies.db
            .urlwatch/error-state.json
            .rsshub-state/state.json
            .urlwatch-last-good
          key: watch-state-${{ github.run_id }}
