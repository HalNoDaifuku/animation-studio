# 新しい仕組み(会社ファイル → サイト監視 / SNS監視 → Discord Bot)のテスト用ワークフロー。
# 手動実行のみ(workflow_dispatch)。いまの定期監視には影響しません。
name: watch-test

on:
  workflow_dispatch:
    inputs:
      job:
        description: 実行する処理
        type: choice
        default: check
        options: [check, rsshub, urlwatch, all]
      dry_run:
        description: 送信せず内容だけ表示する(dry-run)
        type: boolean
        default: true
      only:
        description: この会社だけ実行(slug。空なら全社)
        type: string
        default: ""
      smoke_test:
        description: RSSHubの配信確認(採用ワードで絞らず、最新2件を送る。rsshub のときだけ)
        type: boolean
        default: false
      skip_new:
        description: urlwatch の初回(NEW)を通知しない
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: watch-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL }}
      RSSHUB_ACCESS_KEY: ${{ secrets.RSSHUB_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 設定ファイルのチェック
        run: python scripts/check_companies.py

      - name: 単体テスト
        if: inputs.job == 'check'
        run: python -m unittest discover -s tests

      # 状態(キャッシュ)。実行のたびに保存し直す。
      - name: 状態を復元
        if: inputs.job != 'check'
        uses: actions/cache@v4
        with:
          path: |
            .urlwatch/cache-companies.db
            .rsshub-state/state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      - name: RSSHub
        if: inputs.job == 'rsshub' || inputs.job == 'all'
        run: python scripts/rsshub_notify.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }} ${{ inputs.smoke_test && '--no-filter --notify-on-first-run --limit 2' || '' }}

      - name: urlwatch
        if: inputs.job == 'urlwatch' || inputs.job == 'all'
        run: python scripts/urlwatch_notify.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.skip_new && '--skip-new' || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
